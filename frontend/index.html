<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo App</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    li.completed { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>Todo App</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="New todo…" required />

  </form>
  <ul id="todo-list"></ul>

  <script src="app.js"></script>
</body>
</html>
